<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- 5 Contenedores que no pueden faltar en una pagina web 
    
    Estructura_______________________ (esqueleto)
    1. Cabecera o <header>
    2. Contenido principal o <main>
    3. Pie de pagina o <footer>

    Subcontenedores__________________ (partes de ese esqueleto)
    4. Seccion de una pagina o <section>
    5. Contenedor de navegacion o <nav>
    
    Opcionales_______________________ (depende del caso)
    6. Contenedor lateral o <aside>
    7. Articulo o <article> para contenidos de noticias
    -->
    
    <!-- Tomando como referencia la pagina https://www.apple.com/ -->
    <!-- Cabecera: Parte superior de la pagina web -->
    <header>
        <nav></nav>
    </header>

    <!-- Contenido principal: El contenido fundamental de la web -->
    <main>

        <section>
            <!-- Surprise and shine -->
        </section>
        
        <section>
            <!-- Mac mini -->
        </section>

        <section>
            <!-- Mac mini y Mac studio -->
        </section>

        <!-- Seccion doble -->
        <section>
            <section><!-- Seccion iphone --></section>

            <section><!-- Seccion college --></section>
        </section>

        <!-- Seccion doble -->
        <section>
            <section><!-- Seccion Macbook --></section>

            <section><!-- Seccion ipad --></section>
        </section>

        <!-- Seccion doble -->
        <section>
            <section><!-- Seccion Tradein --></section>

            <section><!-- Seccion card --></section>
        </section>

        <section>
            <!-- Seccion galeria -->
        </section>
    </main>

    <!-- Pie de pagina: Parte inferior de la pagina web con info, navegacion, etc -->
    <footer>
        <section>
            <!-- Info legales -->
        </section>

        <!-- Contenedor de navegacion -->
        <nav>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </nav>

        <section>
            <div></div>
            <hr>
            <div></div>
        </section>
    </footer>
</body>
</html>
